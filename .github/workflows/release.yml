# Push a tag like v1.5 -> build the APK, sign it with the release key (plus the key rotation), publish a release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.5"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      # Release key (signs everything) and the old shared debug key (only to prove the
      # rotation: signing/rotation.lineage says debug key -> release key, so phones holding a
      # copy signed with the debug key take this update in place).
      - name: Restore signing keys
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "DEBUG_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "RELEASE_KEYSTORE_PASSWORD secret is missing"; exit 1; }
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=wingcustom\nstoreFile=keystore/release.jks\n' \
            "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEYSTORE_PASSWORD" > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      # v1/v2 with the old key (Android 8.x), v3 with the release key and the rotation proof
      # (Android 9+), so every installed copy accepts the update.
      - name: Sign with the key rotation
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign \
            --ks keystore/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --next-signer \
            --ks keystore/release.jks --ks-key-alias wingcustom \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEYSTORE_PASSWORD \
            --lineage signing/rotation.lineage --rotation-min-sdk-version 28 \
            --out "WingCustom-${TAG}.apk" app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs -v "WingCustom-${TAG}.apk" | grep -E "Verified using|Signer #|certificate DN"

      # Notes: the tag's annotation if it has one, else GitHub's generated notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$TAG")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "GoDaijishou-${TAG}.apk" -y 2>/dev/null || true # the name before Wing Custom
            gh release upload "$TAG" "WingCustom-${TAG}.apk" --clobber
          elif [ -n "$notes" ]; then
            gh release create "$TAG" "WingCustom-${TAG}.apk" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "WingCustom-${TAG}.apk" --title "$TAG" --generate-notes
          fi

      # The APK's SHA-256 and, when the VIRUSTOTAL_API_KEY secret is set, a VirusTotal scan of
      # it, added under the release notes. Google Play Protect asks to scan an app it has not
      # seen (this one comes from GitHub, and updates itself): the scan is the answer anyone
      # can check. A scan that fails never fails the release.
      - name: Scan report
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          apk="WingCustom-${TAG}.apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          body=$(gh release view "$TAG" --json body -q .body)
          vt="https://www.virustotal.com/gui/file/$sha"
          extra=""
          case "$body" in *"$sha"*) ;; *) extra=$'\n\n---\n'"SHA-256: \`$sha\`";; esac
          case "$body" in *"$vt"*) ;; *)
            if [ -z "$VT_KEY" ]; then
              echo "VIRUSTOTAL_API_KEY not set: SHA-256 only"
            elif curl -sf --max-time 300 -H "x-apikey: $VT_KEY" -F "file=@$apk" \
                https://www.virustotal.com/api/v3/files >/dev/null; then
              extra="$extra"$'\n'"VirusTotal: $vt"
            else
              echo "VirusTotal upload failed"
            fi;;
          esac
          [ -n "$extra" ] && gh release edit "$TAG" --notes "$body$extra" || echo "nothing to add"
