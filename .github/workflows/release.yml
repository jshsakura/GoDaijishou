# Push a tag like v1.5 -> build the APK, sign it with the shared debug key, publish a release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.5"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: gradle

      # Same key as local builds, so the release installs over the app already on the phone.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "DEBUG_KEYSTORE_BASE64 secret is missing"; exit 1; }
          mkdir -p keystore
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "GoDaijishou-${TAG}.apk"

      # Notes: the tag's annotation if it has one, else GitHub's generated notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(git tag -l --format='%(contents)' "$TAG")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "GoDaijishou-${TAG}.apk" --clobber
          elif [ -n "$notes" ]; then
            gh release create "$TAG" "GoDaijishou-${TAG}.apk" --title "$TAG" --notes "$notes"
          else
            gh release create "$TAG" "GoDaijishou-${TAG}.apk" --title "$TAG" --generate-notes
          fi
