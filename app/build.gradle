plugins {
    id 'com.android.application'
}

def hookRev() {
    def md = java.security.MessageDigest.getInstance("SHA-1")
    fileTree("src/main/java") {
        include "**/*.java"
        exclude "**/MainActivity.java", "**/StripView.java"
    }.files.sort { it.path }.each { md.update(it.bytes) }
    return md.digest().encodeHex().toString().substring(0, 12)
}

android {
    namespace 'kr.opencourse.godaijishou'
    // 1. 컴파일 SDK 버전을 34로 올립니다.
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "kr.opencourse.godaijishou"
        minSdkVersion 26
        // 2. 타겟 SDK 버전도 34로 맞춰줍니다.
        targetSdkVersion 34
        versionCode 40
        versionName "2.2.6"

        // Fingerprint of the code that runs inside system_server / SystemUI (all sources but
        // the app's own screen and the hot-swapped StripView). The hook reports the value it
        // was loaded with; the app asks for a reboot only when that differs from its own.
        buildConfigField "String", "HOOK_REV", "\"${hookRev()}\""

        resValue "string", "xposed_description", "Go Daijishou - LG Second Launcher to Daijishou Redirector by Husband of Rebekah"
        //resValue "string-array", "xposed_scope", "com.lge.secondlauncher"
    }

    // 집/회사 어디서 빌드하든 같은 키로 서명되도록 keystore/debug.keystore 를 쓴다 (gitignore, 없으면 기본 ~/.android 키).
    def sharedDebugKeystore = rootProject.file("keystore/debug.keystore")
    // The release key (keystore.properties + keystore/release.jks, both git-ignored; CI writes
    // them from secrets). Debug builds use it too, so an adb install and a release replace
    // each other. Releases also carry signing/rotation.lineage (debug key -> release key, added
    // in CI by apksigner) so copies signed with the old debug key update in place.
    def releaseProps = new Properties()
    def releasePropsFile = rootProject.file("keystore.properties")
    if (releasePropsFile.exists()) releasePropsFile.withInputStream { releaseProps.load(it) }
    def hasReleaseKey = releaseProps.getProperty("storeFile") != null
            && rootProject.file(releaseProps.getProperty("storeFile")).exists()
    signingConfigs {
        debug {
            if (sharedDebugKeystore.exists()) {
                storeFile sharedDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(releaseProps.getProperty("storeFile"))
                storePassword releaseProps.getProperty("storePassword")
                keyAlias releaseProps.getProperty("keyAlias")
                keyPassword releaseProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The release key when present (see signingConfigs), else the shared debug key.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }
    // Stable resource IDs. The notification panel, volume bar and battery bar run inside
    // system_server with the code loaded at boot, but read strings and icons from the
    // installed APK by ID. aapt2 keeps every ID listed in resource-ids.txt, so an update
    // that adds resources no longer shifts the old ones (the panel kept showing the wrong
    // text and icons until a reboot). New resources get free IDs; refresh the file from
    // build/intermediates/stable_resource_ids_file/ after adding some.
    androidResources {
        additionalParameters += ["--stable-ids", file("resource-ids.txt").absolutePath]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation libs.junit
    implementation libs.material
    implementation libs.swiperefreshlayout

    // 기존 Xposed API 의존성
    compileOnly(libs.xposed.api)
    compileOnly(libs.xposed.api.sources)
}
