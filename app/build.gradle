plugins {
    id 'com.android.application'
}

def hookRev() {
    def md = java.security.MessageDigest.getInstance("SHA-1")
    fileTree("src/main/java") {
        include "**/*.java"
        exclude "**/MainActivity.java", "**/StripView.java"
    }.files.sort { it.path }.each { md.update(it.bytes) }
    return md.digest().encodeHex().toString().substring(0, 12)
}

android {
    namespace 'kr.opencourse.godaijishou'
    // 1. 컴파일 SDK 버전을 34로 올립니다.
    compileSdkVersion 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "kr.opencourse.godaijishou"
        minSdkVersion 26
        // 2. 타겟 SDK 버전도 34로 맞춰줍니다.
        targetSdkVersion 34
        versionCode 15
        versionName "2.0"

        // Fingerprint of the code that runs inside system_server / SystemUI (all sources but
        // the app's own screen and the hot-swapped StripView). The hook reports the value it
        // was loaded with; the app asks for a reboot only when that differs from its own.
        buildConfigField "String", "HOOK_REV", "\"${hookRev()}\""

        resValue "string", "xposed_description", "Go Daijishou - LG Second Launcher to Daijishou Redirector by Husband of Rebekah"
        //resValue "string-array", "xposed_scope", "com.lge.secondlauncher"
    }

    // 집/회사 어디서 빌드하든 같은 키로 서명되도록 keystore/debug.keystore 를 쓴다 (gitignore, 없으면 기본 ~/.android 키).
    def sharedDebugKeystore = rootProject.file("keystore/debug.keystore")
    signingConfigs {
        debug {
            if (sharedDebugKeystore.exists()) {
                storeFile sharedDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 개인용 모듈이라 별도 릴리즈 키스토어를 관리하지 않고 디버그 키로 서명한다.
            // (안드로이드는 미서명 APK 설치를 거부하므로 서명 자체는 필수)
            signingConfig signingConfigs.debug
        }
    }
    // Stable resource IDs. The notification panel, volume bar and battery bar run inside
    // system_server with the code loaded at boot, but read strings and icons from the
    // installed APK by ID. aapt2 keeps every ID listed in resource-ids.txt, so an update
    // that adds resources no longer shifts the old ones (the panel kept showing the wrong
    // text and icons until a reboot). New resources get free IDs; refresh the file from
    // build/intermediates/stable_resource_ids_file/ after adding some.
    androidResources {
        additionalParameters += ["--stable-ids", file("resource-ids.txt").absolutePath]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.material

    // 기존 Xposed API 의존성
    compileOnly(libs.xposed.api)
    compileOnly(libs.xposed.api.sources)
}
